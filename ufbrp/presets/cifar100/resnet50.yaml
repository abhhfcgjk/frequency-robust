label_strategy: origin
perc: no
eval_only: no
results_dir: ufbrp/results-cifar100
logs_dir: ufbrp/logs

data:
  num_classes: 100
  dataset: CIFAR100
  directory: data/CIFAR100

lr_scheduler:
  type: step
  step_size: 40
  gamma: 0.1

optimizer:
  type: adam
  lr: 0.001

train:
  model: resnet50
  epochs: 500
  num_workers: 2
  batch_size: 128
  val_criterion: Accuracy

attack:
  train:
    type: none
  test:
    -
      type: fgsm
      params:
        eps: 8.0
        alpha: 2.5
        mode: zero
    -
      type: pgd
      params:
        eps: 8.0
        alpha: 2.5
        mode: zero
    -
      type: autoattack
      params:
        eps: 8.0
        mode: zero